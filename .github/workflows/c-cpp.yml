name: C/C++ CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: ubuntu-x64
            runs-on: ubuntu-latest
            arch: x64
          - name: ubuntu-arm64
            runs-on: ubuntu-24.04-arm64
            arch: arm64

    runs-on: ${{ matrix.runs-on }}

    steps:
    - uses: actions/checkout@v4
    - name: configure
      run: ./configure --default-yes
    - name: make
      run: make
    - name: make test
      run: make test

